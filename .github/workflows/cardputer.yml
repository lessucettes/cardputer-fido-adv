name: cardputer-adv

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: cardputer-adv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Configure native tests
        run: |
          cmake -S tests/cardputer -B build/cardputer-host -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DCARDPUTER_SANITIZERS=ON
      - name: Build native tests
        run: cmake --build build/cardputer-host
      - name: Run native tests
        run: ctest --test-dir build/cardputer-host --output-on-failure -R '^cardputer_'
      - name: Run policy and packaging tests
        run: python3 -m unittest discover -s tests/cardputer -p '*_test.py'

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Install ESP-IDF v5.5.3
        run: |
          git clone -b v5.5.3 --depth 1 --recursive \
            https://github.com/espressif/esp-idf.git /tmp/esp-idf
          /tmp/esp-idf/install.sh esp32s3
      - name: Build ADV firmware
        run: |
          . /tmp/esp-idf/export.sh
          bash scripts/cardputer/build.sh
      - name: Verify build policy
        run: python3 scripts/cardputer/check-build.py build/cardputer-adv
      - name: Package app-only update
        run: |
          python3 scripts/cardputer/package.py --build build/cardputer-adv \
            --out dist/cardputer-adv
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: cardputer-adv-app
          path: dist/cardputer-adv/
          if-no-files-found: error
